name: Publish NuGet

# Run manually to release master: bumps the version when master has unreleased commits, builds the
# package, pushes it to nuget.org and opens the PR that updates it in the Interactive Brokers brokerage.
# Safe to rerun after a failure, finished steps are skipped.
on: workflow_dispatch

concurrency: publish

jobs:
  publish:
    # Only publish what is merged, a pushed version can't be replaced
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets NuGet/login exchange the GitHub OIDC token for a short-lived nuget.org API key
    steps:
      # Full history: the release reads it to tell what changed since the last version
      - uses: actions/checkout@v7
        with:
          path: IBAutomater
          fetch-depth: 0
          token: ${{ secrets.QC_GIT_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: QuantConnect/Lean.Brokerages.InteractiveBrokers
          path: brokerage
          token: ${{ secrets.QC_GIT_TOKEN }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The temporary API key expires after 1 hour, plenty for the build below
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.QC_GIT_TOKEN }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # Commits made here belong to whoever ran the workflow
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          bash IBAutomater/release.sh brokerage
