name: Publish NuGet

# Run manually to build the package with the version in the csproj and push it to nuget.org
on: workflow_dispatch

jobs:
  publish:
    # Only publish what is merged, a pushed version can't be replaced
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets NuGet/login exchange the GitHub OIDC token for a short-lived nuget.org API key
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The temporary API key expires after 1 hour, plenty for the build below
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Build and push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: ./build_push_nuget.sh
